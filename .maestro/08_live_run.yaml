url: ${APP_URL || 'http://localhost:8081'}
name: Live run timer with laps hands off to logging; weekly history
tags: [core, live]
---
- runFlow: subflows/onboard.yaml
# Discard path
- tapOn:
    id: tab-log
- tapOn:
    id: log-start-live
- assertVisible:
    id: live-screen
- tapOn:
    id: live-discard
- tapOn:
    id: live-discard-confirm
- assertVisible:
    id: home-screen
# Timed run with a lap and a pause
- tapOn:
    id: tab-log
- tapOn:
    id: type-tempo
- tapOn:
    id: log-start-live
- extendedWaitUntil:
    visible:
      id: live-elapsed
      text: "0:0[2-9]"
    timeout: 10000
- tapOn:
    id: live-lap
- assertVisible: "Lap 1"
- tapOn:
    id: live-toggle
- assertVisible: "Resume"
- assertVisible: ".*Paused"
- tapOn:
    id: live-toggle
- assertVisible: "Pause"
- tapOn:
    id: live-finish
# Log form arrives prefilled with the time and lap splits
- assertVisible:
    id: log-screen
- assertVisible:
    id: log-duration
    text: "0:[0-9]{2}"
- assertVisible:
    id: log-notes
    text: "Laps: 1\\) .*"
- assertNotVisible:
    id: log-start-live
- tapOn:
    id: log-distance
- inputText: "0.05"
- tapOn:
    id: log-save
- assertVisible:
    id: celebration-xp
- tapOn:
    id: run-done
- tapOn:
    id: home-profile
- assertVisible:
    id: profile-history
- assertVisible:
    id: profile-history-current
    text: "This week .* 0.1 km"
